<svg viewBox="0 0 1280 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sina Mohebbi — Edge AI and Embedded Systems Engineer" font-family="'Fira Code', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071312"/>
      <stop offset="0.55" stop-color="#0a1a1c"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="chipGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2dd4bf" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2" fill="#2dd4bf"/>
    </marker>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)"/>
  <circle cx="215" cy="170" r="185" fill="#2dd4bf" opacity="0.07"/>
  <circle cx="1060" cy="180" r="150" fill="#38bdf8" opacity="0.08"/>

  <!-- ===== LEFT: full neural network (the "big" model) ===== -->
  <g stroke="url(#wire)" stroke-width="1.4" opacity="0.9">
    <!-- layer x positions: 70,140,210 ; nodes -->
    <path d="M70 90 L140 70"/><path d="M70 90 L140 130"/><path d="M70 90 L140 190"/><path d="M70 90 L140 250"/>
    <path d="M70 170 L140 70"/><path d="M70 170 L140 130"/><path d="M70 170 L140 190"/><path d="M70 170 L140 250"/>
    <path d="M70 250 L140 70"/><path d="M70 250 L140 130"/><path d="M70 250 L140 190"/><path d="M70 250 L140 250"/>
    <path d="M140 70 L210 110"/><path d="M140 70 L210 210"/>
    <path d="M140 130 L210 110"/><path d="M140 130 L210 210"/>
    <path d="M140 190 L210 110"/><path d="M140 190 L210 210"/>
    <path d="M140 250 L210 110"/><path d="M140 250 L210 210"/>
  </g>
  <g fill="#071312" stroke="url(#teal)" stroke-width="2" filter="url(#glow)">
    <circle cx="70" cy="90" r="9"/><circle cx="70" cy="170" r="9"/><circle cx="70" cy="250" r="9"/>
    <circle cx="140" cy="70" r="9"/><circle cx="140" cy="130" r="9"/><circle cx="140" cy="190" r="9"/><circle cx="140" cy="250" r="9"/>
    <circle cx="210" cy="110" r="9"/><circle cx="210" cy="210" r="9"/>
  </g>

  <!-- ===== MIDDLE: compression flow ===== -->
  <g filter="url(#glow)">
    <path d="M235 160 C 300 160, 320 160, 380 160" stroke="url(#wire)" stroke-width="2.5" fill="none" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="28;0" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="308" y="145" text-anchor="middle" font-size="12" fill="#5eead4" letter-spacing="1">quantize · int8</text>
  <path d="M360 152 l16 8 l-16 8 z" fill="#38bdf8"/>

  <!-- ===== RIGHT: microcontroller (the "small" deploy target) ===== -->
  <g transform="translate(1010 170)">
    <circle cx="0" cy="0" r="120" fill="url(#chipGlow)"/>
    <!-- pins -->
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <path d="M-58 -58 v-22"/><path d="M-29 -58 v-22"/><path d="M0 -58 v-22"/><path d="M29 -58 v-22"/><path d="M58 -58 v-22"/>
      <path d="M-58 58 v22"/><path d="M-29 58 v22"/><path d="M0 58 v22"/><path d="M29 58 v22"/><path d="M58 58 v22"/>
      <path d="M-58 -58 h-22"/><path d="M-58 -29 h-22"/><path d="M-58 0 h-22"/><path d="M-58 29 h-22"/><path d="M-58 58 h-22"/>
      <path d="M58 -58 h22"/><path d="M58 -29 h22"/><path d="M58 0 h22"/><path d="M58 29 h22"/><path d="M58 58 h22"/>
    </g>
    <rect x="-58" y="-58" width="116" height="116" rx="12" fill="#0a1a1c" stroke="url(#teal)" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="-34" y="-34" width="68" height="68" rx="6" fill="none" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#5eead4">AI</text>
    <text x="0" y="26" text-anchor="middle" font-size="9" fill="#38bdf8" letter-spacing="2">MCU</text>
    <circle cx="0" cy="0" r="0" fill="none" stroke="#2dd4bf" stroke-width="2">
      <animate attributeName="r" values="30;95" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== TEXT ===== -->
  <text x="640" y="150" text-anchor="middle" font-size="58" font-weight="800" fill="url(#teal)" filter="url(#glow)" letter-spacing="2">SINA&#160;MOHEBBI</text>
  <text x="640" y="188" text-anchor="middle" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="4">EDGE&#160;AI&#160;&#183;&#160;EMBEDDED&#160;SYSTEMS&#160;&#183;&#160;TINYML</text>

  <!-- chips -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <g><rect x="452" y="212" width="78" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.5"/><text x="491" y="231" fill="#5eead4">TinyML</text></g>
    <g><rect x="540" y="212" width="70" height="28" rx="14" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.5"/><text x="575" y="231" fill="#7dd3fc">ESP32</text></g>
    <g><rect x="620" y="212" width="78" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.5"/><text x="659" y="231" fill="#5eead4">PyTorch</text></g>
    <g><rect x="708" y="212" width="64" height="28" rx="14" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.5"/><text x="740" y="231" fill="#7dd3fc">IoT</text></g>
    <g><rect x="782" y="212" width="80" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.5"/><text x="822" y="231" fill="#5eead4">RISC-V</text></g>
  </g>

  <text x="640" y="290" text-anchor="middle" font-size="13" fill="#64748b" letter-spacing="1">Training models big, deploying them small.  ·  Bologna, Italy</text>

  <!-- corner brackets -->
  <g stroke="url(#teal)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M40 40 h30 M40 40 v30"/>
    <path d="M1240 40 h-30 M1240 40 v30"/>
    <path d="M40 300 h30 M40 300 v-30"/>
    <path d="M1240 300 h-30 M1240 300 v-30"/>
  </g>
</svg>
