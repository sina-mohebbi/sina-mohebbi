<svg viewBox="0 0 1280 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sensor signal to FFT to neural network to microcontroller, deployed across robotics, industrial automation, automotive and drones">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.5" stop-color="#120f1f"/>
      <stop offset="1" stop-color="#1a1206"/>
    </linearGradient>
    <linearGradient id="gSpectrum" x1="60" y1="0" x2="1240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.3" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="0.8" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="gWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="gBarHi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="gNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gWire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="gChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="chipGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#94a3b8" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="18" fill="url(#dots)"/>
  <ellipse cx="250" cy="150" rx="280" ry="180" fill="url(#haloL)"/>
  <ellipse cx="580" cy="150" rx="260" ry="170" fill="url(#haloM)"/>
  <ellipse cx="920" cy="150" rx="360" ry="185" fill="url(#haloR)"/>
  <line x1="55" y1="150" x2="820" y2="150" stroke="url(#gSpectrum)" stroke-opacity="0.14" stroke-width="1"/>

  <!-- ===== 1. sensor waveform (fused signals) ===== -->
  <path d="M55 150 C 66 128,89 128,100 150 S 134 172,145 150 S 179 128,190 150 S 224 172,235 150"
        fill="none" stroke="url(#gWave)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M55 150 C 63 139,78 139,88 150 S 113 161,125 150 S 150 139,162 150 S 187 161,200 150 S 223 141,235 150"
        fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>
  <circle r="4" fill="#ecfeff" filter="url(#glow)">
    <animateMotion dur="3.6s" repeatCount="indefinite"
      path="M55 150 C 66 128,89 128,100 150 S 134 172,145 150 S 179 128,190 150 S 224 172,235 150"/>
  </circle>

  <path d="M250 142 l10 8 l-10 8" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- ===== 2. FFT spectrum bars ===== -->
  <g fill="url(#gBar)">
    <rect x="278" y="158" width="10" height="22" rx="3"/>
    <rect x="296" y="138" width="10" height="42" rx="3"/>
    <rect x="314" y="116" width="10" height="64" rx="3">
      <animate attributeName="height" values="64;40;64" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="116;140;116" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="332" y="96" width="10" height="84" rx="3"/>
    <rect x="350" y="112" width="10" height="68" rx="3">
      <animate attributeName="height" values="68;92;68" dur="2.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="112;88;112" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="368" y="90" width="10" height="90" rx="3"/>
    <rect x="386" y="120" width="10" height="60" rx="3">
      <animate attributeName="height" values="60;44;60" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;136;120" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="url(#gBarHi)">
    <rect x="404" y="140" width="10" height="40" rx="3"/>
    <rect x="422" y="156" width="10" height="24" rx="3"/>
  </g>

  <path d="M448 142 l10 8 l-10 8" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- ===== 3. neural network ===== -->
  <g stroke="url(#gWire)" stroke-width="1.4">
    <path d="M478 100 L568 116"/><path d="M478 100 L568 150"/><path d="M478 100 L568 184"/>
    <path d="M478 133 L568 116"/><path d="M478 133 L568 150"/><path d="M478 133 L568 184"/>
    <path d="M478 167 L568 116"/><path d="M478 167 L568 150"/><path d="M478 167 L568 184"/>
    <path d="M478 200 L568 116"/><path d="M478 200 L568 150"/><path d="M478 200 L568 184"/>
    <path d="M568 116 L658 133"/><path d="M568 116 L658 167"/>
    <path d="M568 150 L658 133"/><path d="M568 150 L658 167"/>
    <path d="M568 184 L658 133"/><path d="M568 184 L658 167"/>
  </g>
  <g fill="#12101f" stroke="url(#gNode)" stroke-width="2" filter="url(#glow)">
    <circle cx="478" cy="100" r="7"/><circle cx="478" cy="133" r="7"/><circle cx="478" cy="167" r="7"/><circle cx="478" cy="200" r="7"/>
    <circle cx="568" cy="116" r="7"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="568" cy="150" r="7"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="568" cy="184" r="7"><animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="658" cy="133" r="7"/><circle cx="658" cy="167" r="7"/>
  </g>

  <path d="M683 142 l10 8 l-10 8" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- ===== 4. microcontroller ===== -->
  <g transform="translate(768 150)">
    <circle cx="0" cy="0" r="100" fill="url(#chipGlow)"/>
    <g stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round">
      <path d="M-46 -46 v-17"/><path d="M-23 -46 v-17"/><path d="M0 -46 v-17"/><path d="M23 -46 v-17"/><path d="M46 -46 v-17"/>
      <path d="M-46 46 v17"/><path d="M-23 46 v17"/><path d="M0 46 v17"/><path d="M23 46 v17"/><path d="M46 46 v17"/>
      <path d="M-46 -46 h-17"/><path d="M-46 -23 h-17"/><path d="M-46 0 h-17"/><path d="M-46 23 h-17"/><path d="M-46 46 h-17"/>
      <path d="M46 -46 h17"/><path d="M46 -23 h17"/><path d="M46 0 h17"/><path d="M46 23 h17"/><path d="M46 46 h17"/>
    </g>
    <rect x="-46" y="-46" width="92" height="92" rx="11" fill="#1a1206" stroke="url(#gChip)" stroke-width="2.4" filter="url(#glow)"/>
    <rect x="-26" y="-26" width="52" height="52" rx="6" fill="none" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.3"/>
    <g stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.1">
      <path d="M-14 -14 H14 M-14 0 H14 M-14 14 H14 M-14 -14 V14 M0 -14 V14 M14 -14 V14"/>
    </g>
    <g fill="#fcd34d">
      <circle cx="-14" cy="-14" r="2.8"/><circle cx="0" cy="-14" r="2.8"/><circle cx="14" cy="-14" r="2.8"/>
      <circle cx="-14" cy="0" r="2.8"/><circle cx="0" cy="0" r="3.6" fill="#fffbeb"/><circle cx="14" cy="0" r="2.8"/>
      <circle cx="-14" cy="14" r="2.8"/><circle cx="0" cy="14" r="2.8"/><circle cx="14" cy="14" r="2.8"/>
    </g>
    <circle cx="0" cy="0" r="0" fill="none" stroke="#fbbf24" stroke-width="2">
      <animate attributeName="r" values="30;82" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== 5. deploy fan-out to application domains ===== -->
  <g stroke="#f59e0b" stroke-width="1.4" fill="none" stroke-opacity="0.32">
    <path d="M832 150 C 920 150, 980 78, 1069 78"/>
    <path d="M832 150 C 920 150, 980 126, 1069 126"/>
    <path d="M832 150 C 920 150, 980 174, 1069 174"/>
    <path d="M832 150 C 920 150, 980 222, 1069 222"/>
  </g>
  <circle r="3" fill="#fcd34d" opacity="0.9">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M832 150 C 920 150, 980 78, 1069 78"/>
  </circle>
  <circle r="3" fill="#fcd34d" opacity="0.9">
    <animateMotion dur="3.3s" repeatCount="indefinite" path="M832 150 C 920 150, 980 174, 1069 174"/>
  </circle>

  <!-- application tiles -->
  <!-- Robotics -->
  <g transform="translate(1095 78)">
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#1a1206" stroke="url(#gChip)" stroke-width="2" filter="url(#glow)"/>
    <g stroke="#fffbeb" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -15 V-11"/>
      <rect x="-10" y="-11" width="20" height="14" rx="3.5"/>
      <path d="M-13 -6 V0"/><path d="M13 -6 V0"/>
      <path d="M-4 -1 H4"/>
      <path d="M-7 3 V8 H7 V3"/>
    </g>
    <circle cx="0" cy="-16" r="1.5" fill="#fffbeb"/>
    <circle cx="-4" cy="-5" r="1.9" fill="#fcd34d"/><circle cx="4" cy="-5" r="1.9" fill="#fcd34d"/>
  </g>
  <!-- Industrial automation (robotic arm) -->
  <g transform="translate(1095 126)">
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#1a1206" stroke="url(#gChip)" stroke-width="2" filter="url(#glow)"/>
    <g stroke="#fffbeb" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 9 L-5 -1"/>
      <path d="M-5 -1 L9 -7"/>
      <path d="M9 -7 l4 -3"/><path d="M9 -7 l4 3"/>
    </g>
    <rect x="-11" y="9" width="22" height="4" rx="1.2" fill="#fffbeb"/>
    <circle cx="0" cy="9" r="2.3" fill="#1a1206" stroke="#fffbeb" stroke-width="1.6"/>
    <circle cx="-5" cy="-1" r="2.3" fill="#1a1206" stroke="#fffbeb" stroke-width="1.6"/>
  </g>
  <!-- Automotive (car) -->
  <g transform="translate(1095 174)">
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#1a1206" stroke="url(#gChip)" stroke-width="2" filter="url(#glow)"/>
    <g stroke="#fffbeb" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-14 5 V0 L-8 0 L-4 -6 L6 -6 L10 0 L14 0 V5"/>
    </g>
    <circle cx="-7" cy="6" r="3.2" fill="#1a1206" stroke="#fffbeb" stroke-width="1.7"/>
    <circle cx="8" cy="6" r="3.2" fill="#1a1206" stroke="#fffbeb" stroke-width="1.7"/>
  </g>
  <!-- Drone / UAV -->
  <g transform="translate(1095 222)">
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#1a1206" stroke="url(#gChip)" stroke-width="2" filter="url(#glow)"/>
    <g stroke="#fffbeb" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 L-12 -8"/><path d="M0 0 L12 -8"/><path d="M0 0 L-12 8"/><path d="M0 0 L12 8"/>
    </g>
    <rect x="-4.5" y="-3.5" width="9" height="7" rx="2" fill="#1a1206" stroke="#fffbeb" stroke-width="1.6"/>
    <g fill="#fcd34d">
      <ellipse cx="-12" cy="-8" rx="5.5" ry="1.9"/><ellipse cx="12" cy="-8" rx="5.5" ry="1.9"/>
      <ellipse cx="-12" cy="8" rx="5.5" ry="1.9"/><ellipse cx="12" cy="8" rx="5.5" ry="1.9"/>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="url(#gSpectrum)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M40 40 h26 M40 40 v26"/>
    <path d="M1240 40 h-26 M1240 40 v26"/>
    <path d="M40 260 h26 M40 260 v-26"/>
    <path d="M1240 260 h-26 M1240 260 v-26"/>
  </g>
</svg>
