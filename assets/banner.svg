<svg viewBox="0 0 1280 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sensor signal to FFT to neural network to microcontroller">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1526"/>
      <stop offset="0.55" stop-color="#141019"/>
      <stop offset="1" stop-color="#241610"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="chipGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c4a2d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c4a2d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#c9a27a" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="18" fill="url(#dots)"/>
  <ellipse cx="360" cy="150" rx="380" ry="200" fill="url(#haloL)"/>
  <ellipse cx="1030" cy="150" rx="300" ry="190" fill="url(#haloR)"/>
  <line x1="60" y1="150" x2="1220" y2="150" stroke="#60a5fa" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ===== 1. sensor waveform (fused signals) ===== -->
  <path d="M70 150 C 82 124,108 124,120 150 S 158 176,170 150 S 208 124,220 150 S 258 176,270 150 S 308 124,320 150"
        fill="none" stroke="url(#blue)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M70 150 C 78 137,96 137,105 150 S 135 163,150 150 S 180 137,195 150 S 225 163,240 150 S 285 137,300 150 S 316 158,320 150"
        fill="none" stroke="#c9a27a" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>
  <circle r="4" fill="#dbe9ff" filter="url(#glow)">
    <animateMotion dur="3.6s" repeatCount="indefinite"
      path="M70 150 C 82 124,108 124,120 150 S 158 176,170 150 S 208 124,220 150 S 258 176,270 150 S 308 124,320 150"/>
  </circle>

  <!-- chevron -->
  <path d="M338 142 l10 8 l-10 8" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- ===== 2. FFT spectrum bars ===== -->
  <g fill="url(#bar)">
    <rect x="368" y="158" width="11" height="22" rx="3"/>
    <rect x="388" y="140" width="11" height="40" rx="3"/>
    <rect x="408" y="120" width="11" height="60" rx="3">
      <animate attributeName="height" values="60;38;60" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;142;120" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="428" y="98" width="11" height="82" rx="3"/>
    <rect x="448" y="114" width="11" height="66" rx="3">
      <animate attributeName="height" values="66;90;66" dur="2.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="114;90;114" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="468" y="90" width="11" height="90" rx="3"/>
    <rect x="488" y="108" width="11" height="72" rx="3">
      <animate attributeName="height" values="72;48;72" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="108;132;108" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="508" y="130" width="11" height="50" rx="3"/>
  </g>
  <g fill="#c9a27a" fill-opacity="0.65">
    <rect x="528" y="146" width="11" height="34" rx="3"/>
    <rect x="548" y="158" width="11" height="22" rx="3"/>
  </g>

  <!-- chevron -->
  <path d="M576 142 l10 8 l-10 8" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- ===== 3. neural network ===== -->
  <g stroke="url(#wire)" stroke-width="1.4">
    <path d="M615 96 L725 114"/><path d="M615 96 L725 150"/><path d="M615 96 L725 186"/>
    <path d="M615 132 L725 114"/><path d="M615 132 L725 150"/><path d="M615 132 L725 186"/>
    <path d="M615 168 L725 114"/><path d="M615 168 L725 150"/><path d="M615 168 L725 186"/>
    <path d="M615 204 L725 114"/><path d="M615 204 L725 150"/><path d="M615 204 L725 186"/>
    <path d="M725 114 L835 132"/><path d="M725 114 L835 168"/>
    <path d="M725 150 L835 132"/><path d="M725 150 L835 168"/>
    <path d="M725 186 L835 132"/><path d="M725 186 L835 168"/>
  </g>
  <g fill="#0e1526" stroke="url(#blue)" stroke-width="2" filter="url(#glow)">
    <circle cx="615" cy="96" r="7"/><circle cx="615" cy="132" r="7"/><circle cx="615" cy="168" r="7"/><circle cx="615" cy="204" r="7"/>
    <circle cx="725" cy="114" r="7"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="725" cy="150" r="7"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="725" cy="186" r="7"><animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="835" cy="132" r="7"/><circle cx="835" cy="168" r="7"/>
  </g>

  <!-- chevron -->
  <path d="M876 142 l10 8 l-10 8" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- ===== 4. microcontroller ===== -->
  <g transform="translate(1030 150)">
    <circle cx="0" cy="0" r="115" fill="url(#chipGlow)"/>
    <g stroke="#60a5fa" stroke-width="3" stroke-linecap="round">
      <path d="M-55 -55 v-20"/><path d="M-27 -55 v-20"/><path d="M0 -55 v-20"/><path d="M27 -55 v-20"/><path d="M55 -55 v-20"/>
      <path d="M-55 55 v20"/><path d="M-27 55 v20"/><path d="M0 55 v20"/><path d="M27 55 v20"/><path d="M55 55 v20"/>
      <path d="M-55 -55 h-20"/><path d="M-55 -27 h-20"/><path d="M-55 0 h-20"/><path d="M-55 27 h-20"/><path d="M-55 55 h-20"/>
      <path d="M55 -55 h20"/><path d="M55 -27 h20"/><path d="M55 0 h20"/><path d="M55 27 h20"/><path d="M55 55 h20"/>
    </g>
    <rect x="-55" y="-55" width="110" height="110" rx="12" fill="#141019" stroke="url(#blue)" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="-30" y="-30" width="60" height="60" rx="7" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.4"/>
    <!-- die core: 3x3 node grid -->
    <g fill="#93c5fd">
      <circle cx="-16" cy="-16" r="3.2"/><circle cx="0" cy="-16" r="3.2"/><circle cx="16" cy="-16" r="3.2"/>
      <circle cx="-16" cy="0" r="3.2"/><circle cx="0" cy="0" r="4" fill="#dbe9ff"/><circle cx="16" cy="0" r="3.2"/>
      <circle cx="-16" cy="16" r="3.2"/><circle cx="0" cy="16" r="3.2"/><circle cx="16" cy="16" r="3.2"/>
    </g>
    <g stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.2">
      <path d="M-16 -16 H16 M-16 0 H16 M-16 16 H16 M-16 -16 V16 M0 -16 V16 M16 -16 V16"/>
    </g>
    <circle cx="0" cy="0" r="0" fill="none" stroke="#60a5fa" stroke-width="2">
      <animate attributeName="r" values="34;92" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- corner brackets -->
  <g stroke="url(#blue)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M40 40 h26 M40 40 v26"/>
    <path d="M1240 40 h-26 M1240 40 v26"/>
    <path d="M40 260 h26 M40 260 v-26"/>
    <path d="M1240 260 h-26 M1240 260 v-26"/>
  </g>
</svg>
