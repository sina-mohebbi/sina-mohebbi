<svg viewBox="0 0 1280 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Edge AI · Embedded Systems · TinyML" font-family="'Fira Code', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241610"/>
      <stop offset="0.55" stop-color="#1c1109"/>
      <stop offset="1" stop-color="#0e1526"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="chipGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#c9a27a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)"/>
  <circle cx="215" cy="170" r="185" fill="#3b82f6" opacity="0.07"/>
  <circle cx="1060" cy="180" r="150" fill="#7c4a2d" opacity="0.14"/>

  <!-- ===== LEFT: full neural network (the "big" model) ===== -->
  <g stroke="url(#wire)" stroke-width="1.4" opacity="0.9">
    <path d="M70 90 L140 70"/><path d="M70 90 L140 130"/><path d="M70 90 L140 190"/><path d="M70 90 L140 250"/>
    <path d="M70 170 L140 70"/><path d="M70 170 L140 130"/><path d="M70 170 L140 190"/><path d="M70 170 L140 250"/>
    <path d="M70 250 L140 70"/><path d="M70 250 L140 130"/><path d="M70 250 L140 190"/><path d="M70 250 L140 250"/>
    <path d="M140 70 L210 110"/><path d="M140 70 L210 210"/>
    <path d="M140 130 L210 110"/><path d="M140 130 L210 210"/>
    <path d="M140 190 L210 110"/><path d="M140 190 L210 210"/>
    <path d="M140 250 L210 110"/><path d="M140 250 L210 210"/>
  </g>
  <g fill="#1c1109" stroke="url(#blue)" stroke-width="2" filter="url(#glow)">
    <circle cx="70" cy="90" r="9"/><circle cx="70" cy="170" r="9"/><circle cx="70" cy="250" r="9"/>
    <circle cx="140" cy="70" r="9"/><circle cx="140" cy="130" r="9"/><circle cx="140" cy="190" r="9"/><circle cx="140" cy="250" r="9"/>
    <circle cx="210" cy="110" r="9"/><circle cx="210" cy="210" r="9"/>
  </g>

  <!-- ===== MIDDLE: flow ===== -->
  <g filter="url(#glow)">
    <path d="M235 160 C 300 160, 320 160, 380 160" stroke="url(#wire)" stroke-width="2.5" fill="none" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="28;0" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M360 152 l16 8 l-16 8 z" fill="#60a5fa"/>

  <!-- ===== RIGHT: microcontroller (the "small" deploy target) ===== -->
  <g transform="translate(1010 170)">
    <circle cx="0" cy="0" r="120" fill="url(#chipGlow)"/>
    <g stroke="#60a5fa" stroke-width="3" stroke-linecap="round">
      <path d="M-58 -58 v-22"/><path d="M-29 -58 v-22"/><path d="M0 -58 v-22"/><path d="M29 -58 v-22"/><path d="M58 -58 v-22"/>
      <path d="M-58 58 v22"/><path d="M-29 58 v22"/><path d="M0 58 v22"/><path d="M29 58 v22"/><path d="M58 58 v22"/>
      <path d="M-58 -58 h-22"/><path d="M-58 -29 h-22"/><path d="M-58 0 h-22"/><path d="M-58 29 h-22"/><path d="M-58 58 h-22"/>
      <path d="M58 -58 h22"/><path d="M58 -29 h22"/><path d="M58 0 h22"/><path d="M58 29 h22"/><path d="M58 58 h22"/>
    </g>
    <rect x="-58" y="-58" width="116" height="116" rx="12" fill="#241610" stroke="url(#blue)" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="-34" y="-34" width="68" height="68" rx="6" fill="none" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#dbe9ff">AI</text>
    <text x="0" y="26" text-anchor="middle" font-size="9" fill="#93c5fd" letter-spacing="2">MCU</text>
    <circle cx="0" cy="0" r="0" fill="none" stroke="#60a5fa" stroke-width="2">
      <animate attributeName="r" values="30;95" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== TEXT ===== -->
  <text x="640" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#f5f0e8" filter="url(#glow)" letter-spacing="1">EDGE&#160;AI</text>
  <text x="640" y="200" text-anchor="middle" font-size="18" font-weight="500" fill="#93c5fd" letter-spacing="5">EMBEDDED&#160;SYSTEMS&#160;&#183;&#160;TINYML</text>

  <!-- chips -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <g><rect x="452" y="224" width="78" height="28" rx="14" fill="#3b82f6" fill-opacity="0.10" stroke="#60a5fa" stroke-opacity="0.55"/><text x="491" y="243" fill="#bfdbfe">TinyML</text></g>
    <g><rect x="540" y="224" width="70" height="28" rx="14" fill="#7c4a2d" fill-opacity="0.18" stroke="#c9a27a" stroke-opacity="0.55"/><text x="575" y="243" fill="#e8d3bd">ESP32</text></g>
    <g><rect x="620" y="224" width="78" height="28" rx="14" fill="#3b82f6" fill-opacity="0.10" stroke="#60a5fa" stroke-opacity="0.55"/><text x="659" y="243" fill="#bfdbfe">PyTorch</text></g>
    <g><rect x="708" y="224" width="64" height="28" rx="14" fill="#7c4a2d" fill-opacity="0.18" stroke="#c9a27a" stroke-opacity="0.55"/><text x="740" y="243" fill="#e8d3bd">IoT</text></g>
    <g><rect x="782" y="224" width="80" height="28" rx="14" fill="#3b82f6" fill-opacity="0.10" stroke="#60a5fa" stroke-opacity="0.55"/><text x="822" y="243" fill="#bfdbfe">RISC-V</text></g>
  </g>

  <!-- corner brackets -->
  <g stroke="url(#blue)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M40 40 h30 M40 40 v30"/>
    <path d="M1240 40 h-30 M1240 40 v30"/>
    <path d="M40 300 h30 M40 300 v-30"/>
    <path d="M1240 300 h-30 M1240 300 v-30"/>
  </g>
</svg>
