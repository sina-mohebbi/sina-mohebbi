<svg viewBox="0 0 1280 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Edge AI · Embedded Systems · TinyML" font-family="'Fira Code', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1526"/>
      <stop offset="0.55" stop-color="#141018"/>
      <stop offset="1" stop-color="#241610"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="1" stop-color="#c9a27a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="280" rx="18" fill="url(#bg)"/>
  <ellipse cx="640" cy="150" rx="520" ry="230" fill="url(#halo)"/>

  <!-- title -->
  <text x="640" y="122" text-anchor="middle" font-size="34" font-weight="700" fill="#f5f0e8" letter-spacing="8">SINA&#160;MOHEBBI</text>
  <text x="640" y="154" text-anchor="middle" font-size="14" font-weight="500" fill="#93c5fd" letter-spacing="6">EDGE&#160;AI&#160;&#160;&#183;&#160;&#160;EMBEDDED&#160;SYSTEMS&#160;&#160;&#183;&#160;&#160;TINYML</text>

  <!-- single elegant signal line below the text: flat -> pulse -> flat, with nodes -->
  <path d="M120 205 H520 l24 -40 l26 80 l24 -40 H760 l24 -26 l26 52 l24 -26 H1160"
        fill="none" stroke="url(#line)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- travelling pulse -->
  <circle r="4.5" fill="#dbe9ff" filter="url(#glow)">
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M120 205 H520 l24 -40 l26 80 l24 -40 H760 l24 -26 l26 52 l24 -26 H1160"/>
  </circle>

  <!-- node dots on the line -->
  <g fill="#0e1526" stroke="#60a5fa" stroke-width="2">
    <circle cx="120" cy="205" r="5"/>
    <circle cx="640" cy="205" r="5"/>
    <circle cx="1160" cy="205" r="5"/>
  </g>
</svg>
